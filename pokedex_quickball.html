<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quickdex - Pokédex Quick Ball</title>
  <meta name="description" content="Pokédex Web moderna e ultra-rápida inspirada no design da Quick Ball (Azul Petróleo #123244 e Dourado #DCBD85), com busca instantânea, tabela de efetividade, golpes, evoluções, status, modo claro/escuro e efeitos sonoros com Web Audio API." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #123244;
      --card-bg: #0d2433;
      --card-hover: #163c50;
      --border-qb: #046683;
      --cyan-accent: #48A0B6;
      --text-soft: #B8DAE3;
      --text-main: #ffffff;
      --gold-main: #DCBD85;
      --gold-light: #EFD7AD;
      --input-bg: #0d2433;
    }

    html.light {
      --bg-main: #FDFBF7;
      --card-bg: #FFFFFF;
      --card-hover: #F4EFE6;
      --border-qb: #DCBD85;
      --cyan-accent: #046683;
      --text-soft: #556976;
      --text-main: #123244;
      --gold-main: #DCBD85;
      --gold-light: #B8DAE3;
      --input-bg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-soft);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-qb);
      border-radius: 4px;
      border: 1px solid var(--cyan-accent);
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    @keyframes shinySparkle {
      0% { transform: scale(0) rotate(0deg); opacity: 0; }
      50% { transform: scale(1.3) rotate(180deg); opacity: 1; }
      100% { transform: scale(0) rotate(360deg); opacity: 0; }
    }
    .sparkle-anim {
      animation: shinySparkle 0.9s ease-out forwards;
    }
    .pulse-glow {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    /* Grid */
    .pokedex-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @media (min-width: 640px) {
      .pokedex-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    }
    @media (min-width: 768px) {
      .pokedex-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px) {
      .pokedex-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }
    }
    /* Floating Card */
    .poke-card {
      background: var(--card-bg);
      border: 1px solid var(--border-qb);
      border-radius: 16px;
      padding: 12px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }
    .poke-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(72, 160, 182, 0.25);
      border-color: var(--cyan-accent);
    }
    /* Type Badges */
    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .type-normal { background: #9fa19f; }
    .type-fire { background: #e62829; }
    .type-water { background: #2980ef; }
    .type-electric { background: #fac000; color: #111; }
    .type-grass { background: #3fa129; }
    .type-ice { background: #3dcef3; color: #111; }
    .type-fighting { background: #ff8000; }
    .type-poison { background: #9141cb; }
    .type-ground { background: #915121; }
    .type-flying { background: #81b9ef; color: #111; }
    .type-psychic { background: #ef4179; }
    .type-bug { background: #91a119; }
    .type-rock { background: #afa981; }
    .type-ghost { background: #704170; }
    .type-dragon { background: #5060e1; }
    .type-dark { background: #50413f; }
    .type-steel { background: #60a1b8; }
    .type-fairy { background: #ef70ef; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13, 30, 41, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-out;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: var(--bg-main);
      border: 1px solid var(--border-qb);
      border-radius: 24px;
      width: 100%;
      max-width: 820px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 35px rgba(72,160,182,0.2);
    }
    .modal-header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-qb);
      padding: 16px 20px;
      position: relative;
      flex-shrink: 0;
    }
    .modal-tabs {
      display: flex;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-qb);
      overflow-x: auto;
      scrollbar-width: none;
      position: sticky;
      top: 0;
      z-index: 20;
      flex-shrink: 0;
    }
    .modal-tab-btn {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 800;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-soft);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .modal-tab-btn.active {
      color: var(--gold-main);
      border-bottom-color: var(--gold-main);
      background: rgba(72, 160, 182, 0.15);
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      color: var(--text-soft);
    }
    .artwork-box {
      width: 140px;
      height: 140px;
      max-height: 140px;
      max-width: 140px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 16px;
      background: rgba(13, 36, 51, 0.5);
      border: 1px solid var(--border-qb);
      padding: 8px;
      flex-shrink: 0;
    }
    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid var(--border-qb);
      background: var(--card-bg);
      color: var(--text-soft);
    }
    .btn:hover {
      border-color: var(--cyan-accent);
      color: #fff;
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold-main), #efd7ad);
      color: #123244;
      border: none;
    }
    .btn-gold:hover {
      box-shadow: 0 0 15px rgba(220,189,133,0.5);
    }
    /* Drawer */
    .sidebar-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 100%;
      max-width: 320px;
      background: var(--bg-main);
      border-right: 1px solid var(--border-qb);
      z-index: 120;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 10px 0 40px rgba(0,0,0,0.8);
    }
    .sidebar-drawer.active {
      transform: translateX(0);
    }
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 110;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .scroll-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
      white-space: nowrap;
    }
    .scroll-row::-webkit-scrollbar { display: none; }
    .loc-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 12px;
    }
    @media (min-width: 640px) {
      .loc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header style="border-bottom: 1px solid var(--border-qb); background: var(--bg-main); position: sticky; top: 0; z-index: 40; padding: 10px 16px;">
    <div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        
        <!-- Logo & Drawer toggle -->
        <div style="display: flex; align-items: center; gap: 10px;">
          <button id="openSidebarBtn" class="btn" style="padding: 8px 10px;" title="Abrir Menu Lateral Quickdex">
            ☰
          </button>
          <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;" onclick="resetSearch()">
            <svg width="32" height="32" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="46" fill="#046683" stroke="#DCBD85" stroke-width="5"/>
              <path d="M10 50 A40 40 0 0 1 90 50" fill="#48A0B6"/>
              <path d="M20 20 L50 45 L80 20 L65 15 L50 35 L35 15 Z" fill="#DCBD85"/>
              <path d="M20 80 L50 55 L80 80 L65 85 L50 65 L35 85 Z" fill="#DCBD85"/>
              <circle cx="50" cy="50" r="14" fill="#ffffff" stroke="#123244" stroke-width="4"/>
              <circle cx="50" cy="50" r="6" fill="#48A0B6"/>
            </svg>
            <div>
              <div style="font-size: 18px; font-weight: 900; letter-spacing: 0.5px; color: var(--text-main);">
                QUICK<span style="color: var(--cyan-accent);">DEX</span>
                <span style="font-size: 9px; padding: 2px 5px; border-radius: 4px; background: var(--gold-main); color: #123244; font-weight: 900; margin-left: 4px;">PRO</span>
              </div>
              <div style="font-size: 10px; font-weight: 700; color: var(--cyan-accent);">Pokédex Nacional Completa</div>
            </div>
          </div>
        </div>

        <!-- Search Bar -->
        <div style="flex: 1; max-width: 440px;">
          <input
            id="searchInput"
            type="text"
            placeholder="Buscar por Nome ou Número (ex: Lucario, #10059, Mega)..."
            style="width: 100%; border: 1px solid var(--border-qb); background: var(--input-bg); color: var(--text-main); border-radius: 14px; padding: 8px 14px; font-size: 13px; outline: none;"
          />
        </div>

        <!-- Controls (Theme, Naming Mode, SFX, Surprise, Favorites) -->
        <div style="display: flex; align-items: center; gap: 6px;">
          <button id="themeToggleBtn" class="btn" title="Alternar Modo Claro / Modo Escuro">
            <span id="themeIcon">☀️</span> <span class="hide-mobile">Tema</span>
          </button>

          <button id="namingToggleBtn" class="btn" title="Alternar idioma de nomes (PT-BR ou Padrão dos Jogos PT+EN)">
            <span id="namingLabel">PT+EN</span>
          </button>

          <button id="randomBtn" class="btn" title="Sortear Pokémon Aleatório">
            🎲 <span class="hide-mobile">Surpresa</span>
          </button>

          <button id="favFilterBtn" class="btn" title="Filtrar Favoritos">
            ❤️ <span id="favCountBadge" style="font-size: 10px; background: var(--gold-main); color: #123244; padding: 1px 5px; border-radius: 10px; font-weight: 900;">0</span>
          </button>

          <button id="muteBtn" class="btn" title="Ligar/Desligar Efeitos Sonoros">
            🔊
          </button>
        </div>
      </div>

      <!-- Quick Gen & Type Bar -->
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="scroll-row" id="genPillsRow"></div>
        <div class="scroll-row" id="typePillsRow"></div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main style="max-width: 1280px; margin: 0 auto; width: 100%; padding: 16px; flex: 1;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
      <span id="resultsCount" style="font-size: 12px; font-weight: 700; color: var(--cyan-accent);">Carregando Pokémon...</span>
      <div style="display: flex; align-items: center; gap: 6px;">
        <label style="font-size: 11px; font-weight: 800; text-transform: uppercase;">Ordenar:</label>
        <select id="sortSelect" style="background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-qb); border-radius: 8px; padding: 4px 8px; font-size: 11px; font-weight: 700; outline: none;">
          <option value="id-asc">Número (#001 ➔ #1302)</option>
          <option value="id-desc">Número (#1302 ➔ #001)</option>
          <option value="name-asc">Nome (A ➔ Z)</option>
          <option value="name-desc">Nome (Z ➔ A)</option>
          <option value="bst-desc">Status BST (Maior)</option>
          <option value="bst-asc">Status BST (Menor)</option>
        </select>
      </div>
    </div>

    <!-- Grid of Cards -->
    <div id="pokemonGrid" class="pokedex-grid"></div>

    <!-- Load more button -->
    <div style="display: flex; justify-content: center; margin-top: 24px;">
      <button id="loadMoreBtn" class="btn btn-gold" style="padding: 10px 24px; font-size: 13px; font-weight: 900;">
        Carregar Mais Pokémon
      </button>
    </div>
  </main>

  <!-- Detail Modal -->
  <div id="detailModalOverlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <button id="modalPrevBtn" class="btn" style="padding: 4px 8px;">◀</button>
            <button id="modalNextBtn" class="btn" style="padding: 4px 8px;">▶</button>
            <span id="modalId" class="mono" style="font-size: 13px; font-weight: 900; color: var(--gold-main); background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border-qb);">#001</span>
          </div>

          <div style="display: flex; align-items: center; gap: 6px;">
            <a id="modalBulbapediaBtn" href="#" target="_blank" rel="noopener noreferrer" class="btn" style="color: var(--text-main);" title="Consultar na Bulbapedia">
              🔗 Bulbapedia ↗
            </a>
            <button id="modalShinyBtn" class="btn" style="color: var(--gold-main); border-color: var(--gold-main);" title="Alternar versão Shiny Brilhante">
              ✨ SHINY
            </button>
            <button id="modalCryBtn" class="btn" title="Ouvir Grito">
              🔊 Grito
            </button>
            <button id="modalFavBtn" class="btn" title="Favoritar">
              🤍
            </button>
            <button id="modalCloseBtn" class="btn" style="padding: 4px 10px; font-size: 14px;">✕</button>
          </div>
        </div>

        <!-- Centerpiece Artwork + Info -->
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px;">
          <div>
            <h2 id="modalName" style="font-size: 26px; font-weight: 900; color: var(--text-main); letter-spacing: -0.5px;">Bulbasaur</h2>
            <div id="modalGenus" style="font-size: 12px; font-weight: 700; color: var(--cyan-accent); margin-top: 2px;">Pokémon Semente</div>
            <div id="modalTypes" style="display: flex; gap: 6px; margin-top: 8px;"></div>
            <div style="display: flex; gap: 12px; margin-top: 10px; font-size: 11px;">
              <div>Altura: <strong id="modalHeight" class="mono" style="color: var(--text-main);">0.7 m</strong></div>
              <div>Peso: <strong id="modalWeight" class="mono" style="color: var(--text-main);">6.9 kg</strong></div>
              <div>Taxa Captura: <strong id="modalCapture" class="mono" style="color: var(--gold-main);">45/255</strong></div>
            </div>
          </div>

          <!-- Strictly bounded image box to prevent leakage onto tabs -->
          <div class="artwork-box">
            <img id="modalImg" src="" alt="" style="max-height: 100%; max-width: 100%; object-contain: contain; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));" />
          </div>
        </div>

        <!-- Forms & Mega/GMax/Paradox Switcher Bar -->
        <div id="modalFormsBar" style="margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(4,102,131,0.4); display: none;">
          <div style="font-size: 11px; font-weight: 900; color: var(--gold-main); margin-bottom: 6px;">
            ⚡ Formas, Megas, Gigantamax & Paradoxos:
          </div>
          <div id="modalFormsList" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
        </div>
      </div>

      <!-- Navigation Tabs (Sticky & separate) -->
      <div class="modal-tabs">
        <button class="modal-tab-btn active" data-tab="stats">1. Status Base</button>
        <button class="modal-tab-btn" data-tab="weakness">2. Fraquezas</button>
        <button class="modal-tab-btn" data-tab="evolution">3. Evoluções</button>
        <button class="modal-tab-btn" data-tab="moves">4. Golpes</button>
        <button class="modal-tab-btn" data-tab="abilities">5. Habilidades</button>
        <button class="modal-tab-btn" data-tab="locations">6. Localizações</button>
      </div>

      <!-- Tab Content Body -->
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Sidebar Drawer -->
  <div id="sidebarOverlay" class="drawer-overlay"></div>
  <aside id="sidebarDrawer" class="sidebar-drawer">
    <div style="padding: 16px; border-bottom: 1px solid var(--border-qb); display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 16px; font-weight: 900; color: var(--text-main);">
        QUICK<span style="color: var(--cyan-accent);">DEX</span> PRO
      </div>
      <button id="closeSidebarBtn" class="btn" style="padding: 4px 8px;">✕</button>
    </div>

    <div style="padding: 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px;">
      <div>
        <div style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--cyan-accent); margin-bottom: 8px;">
          Configurações de Idioma / Nomes
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <button id="optNamingEn" class="btn" style="text-align: left; justify-content: flex-start; padding: 10px;">
            <div>
              <div style="font-weight: 800;">Português + Inglês (Padrão)</div>
              <div style="font-size: 10px; opacity: 0.7;">Golpes originais (Flamethrower, etc.)</div>
            </div>
          </button>
          <button id="optNamingPt" class="btn" style="text-align: left; justify-content: flex-start; padding: 10px;">
            <div>
              <div style="font-weight: 800;">Totalmente em Português</div>
              <div style="font-size: 10px; opacity: 0.7;">Golpes traduzidos (Lança-Chamas, etc.)</div>
            </div>
          </button>
        </div>
      </div>

      <div>
        <div style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--cyan-accent); margin-bottom: 8px;">
          Aparência
        </div>
        <button id="drawerThemeBtn" class="btn" style="width: 100%; justify-content: space-between;">
          <span>Alternar Modo Claro / Escuro</span>
          <span id="drawerThemeIcon">☀️</span>
        </button>
      </div>

      <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-qb); font-size: 11px; opacity: 0.7;">
        Quickdex Web v3.5 • Consome PokéAPI v2
      </div>
    </div>
  </aside>

  <!-- Web Audio API Synthesis -->
  <script>
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      click() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(480, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(720, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      }
      tab() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.06);
      }
      shiny() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const notes = [587, 880, 1174, 1760];
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          const t = this.ctx.currentTime + i * 0.06;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.08, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
          osc.start(t);
          osc.stop(t + 0.2);
        });
      }
    }

  <script>

    function formatPokemonId(id) {
      if (id < 10) return `#00${id}`;
      if (id < 100) return `#0${id}`;
      return `#${id}`;
    }

    function formatPokemonName(name) {
      if (!name) return '';
      if (name.includes('-mega-x')) return `Mega ${formatPokemonName(name.replace('-mega-x', ''))} X`;
      if (name.includes('-mega-y')) return `Mega ${formatPokemonName(name.replace('-mega-y', ''))} Y`;
      if (name.includes('-mega')) return `Mega ${formatPokemonName(name.replace('-mega', ''))}`;
      if (name.includes('-gmax')) return `${formatPokemonName(name.replace('-gmax', ''))} Gigamax`;
      if (name.includes('-alola')) return `${formatPokemonName(name.replace('-alola', ''))} de Alola`;
      if (name.includes('-galar')) return `${formatPokemonName(name.replace('-galar', ''))} de Galar`;
      if (name.includes('-hisui')) return `${formatPokemonName(name.replace('-hisui', ''))} de Hisui`;
      if (name.includes('-paldea')) return `${formatPokemonName(name.replace('-paldea', ''))} de Paldea`;
      return name.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

    // Fetch Master List
    async function initApp() {
      try {
        const res = await fetch(`${BASE_URL}/pokemon?limit=1302&offset=0`);
        const data = await res.json();
        masterList = data.results.map(p => {
          const parts = p.url.split('/').filter(Boolean);
          const id = parseInt(parts[parts.length - 1], 10);
          return { id, name: p.name, types: [] };
        });
        applyFilters();
      } catch (err) {
        document.getElementById('resultsCount').textContent = 'Falha ao carregar PokéAPI. Verifique sua conexão.';
      }
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const sortOpt = document.getElementById('sortSelect').value;

      filteredList = masterList.filter(p => {
        if (q) {
          const matchNum = p.id.toString() === q || `#${p.id}` === q;
          const matchName = p.name.toLowerCase().includes(q);
          if (!matchNum && !matchName) return false;
        }
        if (selectedGen) {
          const g = GENERATIONS.find(gen => gen.id === selectedGen);
          if (p.id < g.start || p.id > g.end) return false;
        }
        if (onlyFavorites && !favorites.includes(p.id)) {
          return false;
        }
        return true;
      });

      // Sort
      filteredList.sort((a, b) => {
        if (sortOpt === 'id-desc') return b.id - a.id;
        if (sortOpt === 'name-asc') return a.name.localeCompare(b.name);
        if (sortOpt === 'name-desc') return b.name.localeCompare(a.name);
        return a.id - b.id;
      });

      displayedCount = PAGE_SIZE;
      renderGrid();
      document.getElementById('resultsCount').textContent = `Exibindo ${Math.min(displayedCount, filteredList.length)} de ${filteredList.length} Pokémon`;
      document.getElementById('loadMoreBtn').style.display = displayedCount < filteredList.length ? 'block' : 'none';

    function toggleFavorite(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(f => f !== id);

    document.getElementById('loadMoreBtn').onclick = () => {

    // Modal Details & Tabs
    async function openPokemonModal(id) {
      document.getElementById('detailModalOverlay').classList.add('active');
      isShinyActive = false;
      document.getElementById('modalShinyBtn').style.background = 'transparent';

      try {
        const res = await fetch(`${BASE_URL}/pokemon/${id}`);

        // Species info
        let speciesData = null;

        const cleanBaseName = data.name.replace(/-mega(-[xy])?/i, '').replace(/-gmax/i, '').replace(/-(alola|galar|hisui|paldea)/i, '');
        const cap = cleanBaseName.charAt(0).toUpperCase() + cleanBaseName.slice(1);

    function renderModalFormsBar(data, speciesData) {
      const bar = document.getElementById('modalFormsBar');
      const list = document.getElementById('modalFormsList');
      list.innerHTML = '';
      const forms = [];
      const seen = new Set();

      // Check varieties
      if (speciesData && speciesData.varieties && speciesData.varieties.length > 1) {
        speciesData.varieties.forEach(v => {
          const parts = v.pokemon.url.split('/').filter(Boolean);
          const vId = parseInt(parts[parts.length - 1], 10);
          if (!seen.has(vId)) {
            seen.add(vId);
            forms.push({ id: vId, label: formatPokemonName(v.pokemon.name), isCurrent: vId === data.id });
          }
        });
      }

      // Check paradox relations
      PARADOX_RELATIONS.forEach(rel => {
        const isMatch = rel.baseId === data.id || (rel.past && rel.past.id === data.id) || (rel.future && rel.future.id === data.id);
        if (isMatch) {
          if (!seen.has(rel.baseId)) {
            seen.add(rel.baseId);
            forms.push({ id: rel.baseId, label: `Base: ${formatPokemonName(rel.baseName)}`, isCurrent: rel.baseId === data.id });
          }
          if (rel.past && !seen.has(rel.past.id)) {
            seen.add(rel.past.id);
            forms.push({ id: rel.past.id, label: `Passado: ${rel.past.label}`, isCurrent: rel.past.id === data.id });
          }
          if (rel.future && !seen.has(rel.future.id)) {
            seen.add(rel.future.id);
            forms.push({ id: rel.future.id, label: `Futuro: ${rel.future.label}`, isCurrent: rel.future.id === data.id });
          }
        }
      });

        bar.style.display = 'block';

          btn.className = `btn ${f.isCurrent ? 'btn-gold' : ''}`;

          btn.style.padding = '4px 10px';
          btn.textContent = f.label;

            sfx.click();

        });

        bar.style.display = 'none';
      }

              <div style="font-size: 11px; opacity: 0.8;">📍 Wild Area, Rolling Fields e Max Raid Dens</div>
            </div>
            <div style="background: var(--card-bg); border: 1px solid var(--border-qb); border-radius: 14px; padding: 12px;">
              <div style="font-size: 12px; font-weight: 800; color: var(--text-main); margin-bottom: 4px;">🎮 Sun & Moon (Alola)</div>
              <div style="font-size: 11px; opacity: 0.8;">📍 Rota 1, Melemele Island & Lush Jungle</div>
            </div>
            <div style="background: var(--card-bg); border: 1px solid var(--border-qb); border-radius: 14px; padding: 12px;">
              <div style="font-size: 12px; font-weight: 800; color: var(--text-main); margin-bottom: 4px;">🎮 Legends: Arceus (Hisui)</div>
              <div style="font-size: 11px; opacity: 0.8;">📍 Obsidian Fieldlands & Crimson Mirelands</div>
            </div>
          </div>
        `;
      }
    }

    // Modal Tabs Click Handler
    document.querySelectorAll('.modal-tab-btn').forEach(btn => {
      btn.onclick = () => {
        sfx.tab();
        document.querySelectorAll('.modal-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderModalTabContent(btn.dataset.tab);
      };
    });

    // Close Modal
    document.getElementById('modalCloseBtn').onclick = () => {
      sfx.click();
      document.getElementById('detailModalOverlay').classList.remove('active');
    };
    document.getElementById('detailModalOverlay').onclick = (e) => {
      if (e.target.id === 'detailModalOverlay') {
        document.getElementById('detailModalOverlay').classList.remove('active');
      }
    };

    // Shiny Toggle in Modal
    document.getElementById('modalShinyBtn').onclick = () => {
      isShinyActive = !isShinyActive;
      if (isShinyActive) {
        sfx.shiny();
        document.getElementById('modalShinyBtn').style.background = 'var(--gold-main)';
        document.getElementById('modalShinyBtn').style.color = '#123244';
      } else {
        sfx.click();
        document.getElementById('modalShinyBtn').style.background = 'transparent';
        document.getElementById('modalShinyBtn').style.color = 'var(--gold-main)';
      }
      if (activePokemonDetail) {
        document.getElementById('modalImg').src = getArtworkUrl(activePokemonDetail.id, isShinyActive);
      }
    };

    // Cry sound
    document.getElementById('modalCryBtn').onclick = () => {
      if (!activePokemonDetail) return;
      const audio = new Audio(`https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${activePokemonDetail.id}.ogg`);
      audio.play().catch(() => {});
    };

    // Favorite in modal
    document.getElementById('modalFavBtn').onclick = () => {
      if (!activePokemonDetail) return;
      toggleFavorite(activePokemonDetail.id);
      const isFav = favorites.includes(activePokemonDetail.id);
      document.getElementById('modalFavBtn').textContent = isFav ? '❤️' : '🤍';
    };

    // Prev / Next in modal
    document.getElementById('modalPrevBtn').onclick = () => {
      if (!activePokemonDetail || activePokemonDetail.id <= 1) return;
      sfx.click();
      openPokemonModal(activePokemonDetail.id - 1);
    };
    document.getElementById('modalNextBtn').onclick = () => {
      if (!activePokemonDetail || activePokemonDetail.id >= 1025) return;
      sfx.click();
      openPokemonModal(activePokemonDetail.id + 1);
    };

    // Sidebar Drawer Toggles
    const sidebar = document.getElementById('sidebarDrawer');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    document.getElementById('openSidebarBtn').onclick = () => {
      sfx.click();
      sidebar.classList.add('active');
      sidebarOverlay.classList.add('active');
    };
    function closeSidebar() {
      sidebar.classList.remove('active');
      sidebarOverlay.classList.remove('active');
    }
    document.getElementById('closeSidebarBtn').onclick = closeSidebar;
    sidebarOverlay.onclick = closeSidebar;

    // Theme toggles
    document.getElementById('themeToggleBtn').onclick = () => {
      sfx.click();
      applyTheme(currentTheme === 'light' ? 'dark' : 'light');
    };
    document.getElementById('drawerThemeBtn').onclick = () => {
      sfx.click();
      applyTheme(currentTheme === 'light' ? 'dark' : 'light');
    };

    // Naming Mode toggles
    document.getElementById('namingToggleBtn').onclick = () => {
      sfx.click();
      applyNamingMode(namingMode === 'pt-en' ? 'pt-br' : 'pt-en');
    };
    document.getElementById('optNamingEn').onclick = () => {
      sfx.click();
      applyNamingMode('pt-en');
      closeSidebar();
    };
    document.getElementById('optNamingPt').onclick = () => {
      sfx.click();
      applyNamingMode('pt-br');
      closeSidebar();
    };

    // Mute SFX Toggle
    document.getElementById('muteBtn').onclick = () => {
      sfx.muted = !sfx.muted;
      document.getElementById('muteBtn').textContent = sfx.muted ? '🔇' : '🔊';
    };

    // Random Pokémon
    document.getElementById('randomBtn').onclick = () => {
      sfx.click();
      if (masterList.length === 0) return;
      const rand = masterList[Math.floor(Math.random() * masterList.length)];
      openPokemonModal(rand.id);
    };

    // Search input
    document.getElementById('searchInput').oninput = applyFilters;
    function resetSearch() {
      document.getElementById('searchInput').value = '';
      selectedGen = null;
      selectedType = null;
      onlyFavorites = false;
      applyFilters();
    }

    // Sort select
    document.getElementById('sortSelect').onchange = applyFilters;

    // Favorite Filter
    document.getElementById('favFilterBtn').onclick = () => {
      sfx.click();
      onlyFavorites = !onlyFavorites;
      document.getElementById('favFilterBtn').style.background = onlyFavorites ? 'rgba(244,63,94,0.3)' : 'var(--card-bg)';
      applyFilters();
    };

    // Start App
    initApp();
  </script>
</body>
</html>
